# Publishes the website to GitHub Pages every time the main branch is pushed.
#
# One-time setup on GitHub: in the repository, open Settings > Pages and set
# "Source" to "GitHub Actions". After that this file does everything.
#
# The site is only published if the tests, the lint check and the build all pass.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Also allows running it by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes arrive close together, let the first deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
